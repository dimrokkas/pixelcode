    <main>
        <h2>Επικοινωνία</h2>
        <form id="contact-form" action="https://formspree.io/f/xkjrgzjw" method="POST">
            <div class="form-group">
                <label for="onoma">Ονοματεπώνυμο:</label>
                <input type="text" id="onoma" name="onoma" placeholder="Συμπληρώστε το όνοματεπώνυμό σας" minlength="3" maxlength="40" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Συμπληρώστε το email σας" required>
            </div>

            <div class="form-group">
                <label for="thema">Θέμα:</label>
                <input type="text" id="thema" name="thema" placeholder="Θέμα Μηνύματος" required>
            </div>

            <div class="form-group">
                <label for="message">Μήνυμα:</label>
                <textarea id="message" name="message" placeholder="Γράψτε το μήνυμά σας" maxlength="150" required></textarea>
            </div>
            <button type="submit">Αποστολή</button>
        </form>
        <p id="success-message" hidden>
            <span>✓</span> Το μήνυμά σας απεστάλη επιτυχώς!
        </p>
    </main>
